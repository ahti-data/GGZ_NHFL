name: Deploy website via SFTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Prepare deploy folder
      run: |
        mkdir -p deploy
        cp dashboard/app.R deploy/
        cp dashboard/extract_ggz_zpm_server.R deploy/
        cp -r dashboard/data deploy/
        cp -r dashboard/utils deploy/
        cp -r dashboard/templates deploy/
        echo "Deploy contents:"
        find deploy -type f | sort

    - name: 🔧 Remove remote directory via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        script: rm -rf /apps/GGZ_NHFL/* || true

    - name: 📂 Sync files via SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './deploy/*'
        remote_path: '/apps/GGZ_NHFL/'
        sftp_only: true
        delete_remote_files: false
